# {plugin.pluginName} properties file

#######################################################################################################
# Default Labels for XPage
releaser.pageTitle=releaser
releaser.pagePathLabel=releaser

releaser.mavenHomePath=
releaser.mavenLocalRepository=
releaser.mavenPrivateReleaseDeploymentRepository=
releaser.noProxyForMaven=
releaser.localSiteBasePath=
#twitter informations
releaser.consumerKey=
releaser.consumerSecret=
releaser.accessToken=
releaser.accessTokenSecret=
releaser.requestTokenURL=
releaser.authorizationURL=
releaser.accessTokenURL=
#workflow releaser
releaser.idWorkflowComponent=1
releaser.idWorkflowLuteceSite=2
releaser.idWorkflowReleaseFromTag=3
releaser.pomParentSiteVersion=3.0.0
releaser.pomParentArtifactId=lutece-site-pom
releaser.pomParentGroupId=fr.paris.lutece.tools

releaser.pomParentMinVersionToCreateDockerImage=8

releaser.threadReleasePoolMaxSize=5
#Applications accounts
releaser.applicationAccountEnable=false
releaser.githubReleaseAccount.login=
releaser.githubReleaseAccount.password=
releaser.gitlabReleaseAccount.login=
releaser.gitlabReleaseAccount.password=

releaser.jenkinsReleaseAccount.login=
releaser.jenkinsReleaseAccount.password=

releaser.localComponentBasePath=

releaser.mergeBackBranches=develop,develop_core7,develop7.x

releaser.branch.default=develop
releaser.branch.parentMajorForDefaultBranch=8
releaser.branch.developmentBranchForLutece7=develop_core7
releaser.branch.developmentBranchForCore7=develop7.x

releaser.githubSearchRepoApi=https://api.github.com/search/repositories?q={0}+org:{1}
releaser.githubSearchRepoApiToken=
releaser.githubRepositoryBaseUrl=https://github.com/
# GitHub repo API, used to check the user write permission before launching a release
releaser.githubRepoApi=https://api.github.com/repos/{0}
releaser.nbSearchItemPerPageLoad=10
# Bugtracker Redmine (internal, direct access, no proxy)
releaser.bugtracker.url=https://dev.lutece.paris.fr/bugtracker/
releaser.bugtracker.apiKey=
# Id of the "Sources" project custom field (repository URL) and TTL of the projects index
releaser.bugtracker.sourcesCustomFieldId=14
releaser.bugtracker.projectsCacheTtlMinutes=120
# Issue counters of the current version (disabled by default, enable per environment)
releaser.bugtracker.issueCountersEnabled=false
releaser.bugtracker.countersCacheTtlMinutes=10